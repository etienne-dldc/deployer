name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true

      - run: vp install

      - run: vp check

      - run: vp test run

      - run: pnpm build

      # The staged SDK tarball must stay SDK-only.
      - run: npm pack --dry-run
        working-directory: build/npm
